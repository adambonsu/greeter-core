name: CI

"on":
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel in-flight runs for the same ref so a fast-follow push doesn't queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUBY_VERSION: "3.3.5"
  BUNDLER_VERSION: "2.5.23"

jobs:
  spec:
    name: RSpec
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler: ${{ env.BUNDLER_VERSION }}
          bundler-cache: true
      - run: bundle exec rspec --format progress

  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler: ${{ env.BUNDLER_VERSION }}
          bundler-cache: true

      - name: Run RuboCop
        run: |
          bundle check
          bundle exec rubocop \
            --config .rubocop.yml \
            --format github